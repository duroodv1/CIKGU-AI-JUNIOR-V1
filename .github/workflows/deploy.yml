name: Terbit PWA dengan audio daripada Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  AUDIO_RELEASE_TAG: audio-v1
  AUDIO_ASSET_PATTERN: cikgu-yasmin-offline*.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kod dari cabang lalai
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Muat turun pek audio daripada Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$AUDIO_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$AUDIO_ASSET_PATTERN" --dir "$RUNNER_TEMP/cikgu-audio"

      - name: Sahkan dan sediakan audio Release
        run: python3 .github/scripts/prepare_audio.py "$RUNNER_TEMP/cikgu-audio" --root .

      - name: Sediakan fail statik Pages
        run: |
          mkdir _site
          cp index.html styles.css manifest.webmanifest sw.js _site/
          cp -r js assets _site/

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Muat naik laman dan audio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4

